name: Publish browser build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false
      - name: Install Godot 4.7.2 and the Web release template
        run: |
          release=https://github.com/godotengine/godot/releases/download/4.7.2-stable
          editor=Godot_v4.7.2-stable_linux.x86_64
          templates=Godot_v4.7.2-stable_export_templates.tpz
          curl --fail --location --silent --show-error --retry 3 --output "$editor.zip" "$release/$editor.zip"
          curl --fail --location --silent --show-error --retry 3 --output "$templates" "$release/$templates"
          sha256sum --check <<EOF
          cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $editor.zip
          f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $templates
          EOF
          unzip -q "$editor.zip" -d "$RUNNER_TEMP"
          install "$RUNNER_TEMP/$editor" "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          template_dir="${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates/4.7.2.stable"
          mkdir -p "$template_dir"
          unzip -q -j "$templates" templates/web_nothreads_release.zip -d "$template_dir"
      - name: Export the game
        run: |
          mkdir -p build/web
          godot --headless --path eight --editor --import --quit
          godot --headless --path eight --export-release Web ../build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.pck
          test -s build/web/index.wasm
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
