[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,tools/*"
export_path="../build/web/index.html"

[preset.0.options]

variant/thread_support=false
html/canvas_resize_policy=0
html/head_include="<script>\ndocument.addEventListener('DOMContentLoaded', () => {\n  const canvas = document.querySelector('#canvas');\n  function resizeCanvas() {\n    const ratio = window.devicePixelRatio || 1;\n    // Cover the window with whole device pixels and clip any partial edge.\n    const width = Math.ceil(window.innerWidth * ratio);\n    const height = Math.ceil(window.innerHeight * ratio);\n    if (canvas.width !== width) canvas.width = width;\n    if (canvas.height !== height) canvas.height = height;\n    canvas.style.width = width / ratio + 'px';\n    canvas.style.height = height / ratio + 'px';\n  }\n  window.addEventListener('resize', resizeCanvas);\n  document.addEventListener('fullscreenchange', resizeCanvas);\n  resizeCanvas();\n});\n</script>"
